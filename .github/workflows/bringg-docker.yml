name: Bringg Docker

# Publishes the Docker image named in the DOCKERHUB_IMAGE secret.
# Release v1.4.7-1 -> <image>:1.4.7-1 + <image>:latest; manual run -> <image>:sha-<short sha>.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build + publish image
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_IMAGE }}
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Image tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then tag="${GITHUB_REF_NAME#v}"; else tag="sha-${GITHUB_SHA::7}"; fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: bringg
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Fail if tag already exists
        run: |
          if docker manifest inspect "$IMAGE:$TAG" > /dev/null 2>&1; then
            echo "::error::image tag $TAG already exists"
            exit 1
          fi

      - name: Build + push
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ github.event_name == 'release' && format('{0}:latest', env.IMAGE) || '' }}
